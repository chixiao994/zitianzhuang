name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装并配置 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 编译 Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: 整理产物
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/FontInstaller-debug.apk

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: FontInstaller-debug
          path: output/FontInstaller-debug.apk
          retention-days: 30
